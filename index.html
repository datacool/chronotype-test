@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg: #06050f;
  --bg2: #0d0b1e;
  --bg3: #141228;

  --amber: #f0a500;

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;

  color: var(--text);
  min-height: 100vh;

/* ── 배경 노이즈 효과 ── */

  z-index: 0;
}

.wrap { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }

/* ── 헤더 ── */
.header { text-align: center; margin-bottom: 48px; }

.channel-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(26,188,156,0.1); border: 1px solid rgba(26,188,156,0.25);
  border-radius: 24px; padding: 6px 16px; font-size: 12px; font-weight: 700;
  color: var(--teal); letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 20px;
}

.header h1 {
  font-size: clamp(22px, 5vw, 32px); font-weight: 900; line-height: 1.25;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #fff 0%, #c4b5f4 40%, var(--teal) 100%);

}

.header p { font-size: 14px; color: var(--muted2); line-height: 1.7; }

/* ── 진행 바 ── */
.progress-wrap { margin-bottom: 36px; }
.progress-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted2); margin-bottom: 8px;
}
.progress-label span:last-child { font-family: 'JetBrains Mono', monospace; color: var(--teal); font-weight: 700; }
.progress-track {
  height: 4px; background: var(--bg3); border-radius: 4px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--teal), var(--amber));
  transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── 질문 카드 ── */
.question-card {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 32px 28px;
  margin-bottom: 20px;
  animation: slideUp 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

.q-num {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  color: var(--teal); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px;
}

.q-text {

}

.options { display: flex; flex-direction: column; gap: 10px; }

.option {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg2); border: 1.5px solid var(--border2);
  border-radius: 12px; padding: 14px 18px;
  cursor: pointer; transition: all 0.2s; user-select: none;

.option:hover { border-color: rgba(26,188,156,0.4); background: rgba(26,188,156,0.05); transform: translateX(4px); }
.option.selected { border-color: var(--teal); background: rgba(26,188,156,0.1); }
.option.selected .opt-key { background: var(--teal); color: var(--bg); border-color: var(--teal); }

.opt-key {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px;
  background: var(--bg3); border: 1.5px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  color: var(--muted2); transition: all 0.2s;
}
.opt-text { font-size: 14px; font-weight: 500; line-height: 1.4; }

/* ── 버튼 ── */
.btn-next {
  width: 100%; padding: 16px; border-radius: 14px; border: none; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 800;
  background: linear-gradient(135deg, var(--teal-d), var(--teal));

  opacity: 0.4; pointer-events: none;
}
.btn-next.active { opacity: 1; pointer-events: all; }
.btn-next.active:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,188,156,0.35); }

/* ── 결과 카드 ── */
.result-wrap { animation: fadeIn 0.6s ease; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

.result-type-badge {

.type-icon { font-size: 52px; margin-bottom: 8px; display: block; }
.type-label {

.type-name {

/* 유형별 컬러 */
.early   .type-name { color: var(--amber); }
.mid-early .type-name { color: var(--teal); }
.mid-late .type-name { color: var(--purple-l); }
.late    .type-name { color: #d94f8c; }

.result-card {
  border-radius: 20px; padding: 28px 24px; margin-bottom: 16px;
  border: 1px solid var(--border2); background: var(--card);

.result-headline {

.result-desc { font-size: 13px; color: var(--muted2); line-height: 1.8; }

.timing-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0 0; }
.timing-cell {

.timing-icon { font-size: 20px; margin-bottom: 6px; }

.warning-card {

.warning-card strong { color: var(--amber); display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

.liberation-box {

.liberation-box p {

.liberation-box span { color: var(--teal); }

.share-prompt {

  border: 1px dashed var(--border2); border-radius: 12px;

.share-prompt strong { color: var(--text); display: block; font-size: 14px; margin-bottom: 4px; }

.btn-share {
  width: 100%; padding: 15px; border-radius: 14px; border: none; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 800;
  background: var(--bg3); color: var(--text); border: 1.5px solid var(--border2);

.btn-share:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-2px); }

.btn-retry {
  width: 100%; padding: 13px; border-radius: 12px; border: 1.5px solid var(--border2);
  background: transparent; color: var(--muted2); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.btn-retry:hover { border-color: var(--muted2); color: var(--text); }

.footer-link {
  text-align: center; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}
.footer-link a { color: var(--teal); text-decoration: none; font-weight: 700; }

/* ── 공유 복사 토스트 ── */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--teal); color: #fff; padding: 12px 24px; border-radius: 30px;

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 480px) {
  .timing-grid { grid-template-columns: 1fr 1fr 1fr; }
  .question-card { padding: 24px 18px; }
}
</style>

function startTest() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';

  showQuestion(0);
}

function showQuestion(idx) {

    <div class="question-card">
      <div class="q-num">Q${idx + 1} — ${q.note}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">
        ${q.options.map((o, i) => `
          <div class="option" onclick="selectOption(this, ${i})" data-val="${i}">
            <div class="opt-key">${o.key}</div>
            <div class="opt-text">${o.text}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <button class="btn-next" id="nextBtn" onclick="nextQuestion(${idx})">
      ${idx < questions.length - 1 ? '다음 질문 →' : '결과 확인하기 ✓'}
    </button>
  `;
}

function selectOption(el, val) {
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  answers[current] = val;
  const btn = document.getElementById('nextBtn');
  btn.classList.add('active');
}

function nextQuestion(idx) {
  if (answers[idx] === undefined) return;
  current = idx + 1;
  if (current >= questions.length) {
    showResult();
  } else {
    showQuestion(current);
  }
}

function calcType() {
  const score = answers.reduce((s, a) => s + a, 0);
  const max = (questions.length - 1) * 3;
  const pct = score / max;
  if (pct < 0.25) return 'early';
  if (pct < 0.5)  return 'mid-early';
  if (pct < 0.75) return 'mid-late';
  return 'late';
}

function showResult() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = '완료 ✓';
  document.getElementById('questionArea').innerHTML = '';

  const type = calcType();
  const r = results[type];

  document.getElementById('resultArea').innerHTML = `
    <div class="result-wrap ${r.cls}">
      <div class="result-type-badge">
        <span class="type-icon">${r.icon}</span>
        <div class="type-label">${r.label}</div>
        <div class="type-name">${r.name}</div>
        <div style="font-size:12px;color:var(--muted2);margin-top:4px;">${r.eng}</div>
      </div>

      <div class="result-card">
        <div class="result-headline">📋 당신의 유형</div>
        <div class="result-desc">${r.desc}</div>

        <div class="timing-grid">
          <div class="timing-cell">
            <div class="timing-icon">⚡</div>
            <div class="timing-label">집중 골든타임</div>
            <div class="timing-val">${r.golden}</div>
          </div>
          <div class="timing-cell">
            <div class="timing-icon">💼</div>
            <div class="timing-label">핵심 업무</div>
            <div class="timing-val">${r.work}</div>
          </div>
          <div class="timing-cell">
            <div class="timing-icon">📚</div>
            <div class="timing-label">공부·학습</div>
            <div class="timing-val">${r.study}</div>
          </div>
        </div>
      </div>

      <div class="warning-card">
        <strong>${r.warning}</strong>
        ${r.warningDesc}
      </div>

      <div class="result-card" style="padding-bottom:20px;">
        <div class="result-headline">🎯 지금 당장 실천할 것</div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
          ${r.tips.map((t, i) => `
            <div style="display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--muted2);">
              <span style="flex-shrink:0;width:20px;height:20px;border-radius:50%;background:rgba(26,188,156,0.15);border:1px solid rgba(26,188,156,0.3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--teal);">${i+1}</span>
              <span>${t}</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="liberation-box">
        <p>아침마다 피곤했던 건<br><span>게으름이 아닐 수 있습니다.</span><br>당신의 뇌 시계가<br>조직의 시간표와 달랐던 겁니다.</p>
      </div>

      <div class="share-prompt">
        <strong>💬 댓글로 결과를 남겨보세요 👇</strong>
        유튜브 영상 댓글에서 당신의 크로노타입을 공유해주세요!
      </div>

      <button class="btn-share" onclick="copyResult('${r.icon} ${r.name} (${r.label})\\n집중 골든타임: ${r.golden}\\n핵심업무: ${r.work}\\n\\n하루 설계자 크로노타입 테스트')">
        📋 결과 텍스트 복사하기
      </button>
      <button class="btn-retry" onclick="location.reload()">↺ 다시 테스트하기</button>
    </div>
  `;
}

function copyResult(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }).catch(() => {
    alert('결과 텍스트:\n\n' + text);
  });
}
</script>
</body>
</html>
